name: Site Watch RSS

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-watch
  cancel-in-progress: false

jobs:

  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Download repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check websites
        run: |
          python monitor.py

      - name: Save monitoring data
        run: |
          git config user.name "site-watch-bot"
          git config user.email "site-watch-bot@users.noreply.github.com"

          git add state.json
          git add feed_items.json
          git add docs/feed.xml

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update website monitoring data [skip ci]"
            git push
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs


  deploy:

    needs: monitor

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
